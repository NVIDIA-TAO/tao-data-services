default_install_hook_types:
- pre-commit
- pre-push
repos:
- repo: local
  hooks:
  - id: update-readme-supported-commands
    name: Update README supported commands
    entry: python3 tools/update_readme_supported_commands.py
    language: system
    pass_filenames: false
    files: ^(setup\.py|runner/tao_ds\.py|docker/manifest\.json|tools/update_readme_supported_commands\.py|README\.md|nvidia_tao_ds/.*/scripts/.*\.py)$
  - id: license-header
    name: license header
    description: Every source file must carry an SPDX license header.
    entry: python3 .github/hooks/check_license_header.py
    language: system
    files: \.(py|sh)$
    stages:
    - pre-push
  - id: pylint
    name: pylint
    description: Static analysis, configured by .pylintrc.
    entry: pylint --rcfile .pylintrc
    language: system
    types:
    - python
    files: ^(nvidia_tao_ds/)
    stages:
    - pre-push
  - id: pydocstyle
    name: pydocstyle
    description: Docstring conventions.
    entry: pydocstyle --ignore=D4,D200,D203,D205,D210,D212,D213,D301,D400,D401
    language: system
    types:
    - python
    files: ^(nvidia_tao_ds/)
    stages:
    - pre-push
  - id: flake8
    name: flake8
    description: Style and lint checks.
    entry: flake8 --ignore=E24,W504,E501
    language: system
    types:
    - python
    files: ^(nvidia_tao_ds/)
    stages:
    - pre-push
