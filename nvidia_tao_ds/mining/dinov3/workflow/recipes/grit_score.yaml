schema_version: "1.0"

workflow:
  strategy: grit_score
  initialization: base_checkpoint
  max_rounds: 10
  persistent_target_rounds: 3
  # Optional when evaluation is configured. The controller stops after this
  # many rounds without a meaningful weighted KPI improvement and delivers
  # the best evaluated checkpoint, not necessarily the last checkpoint.
  # early_stopping:
  #   patience: 2
  #   min_delta: 0.002
  #   metrics:
  #     - {task: classification, name: macro_f1, weight: 1.0}
  #     - {task: retrieval, name: recall_at_1, weight: 1.0}

model:
  base_checkpoint: /path/to/base_dinov3_checkpoint.pth

data:
  # Query and reference rows contain sample_id, task, role, storage_type,
  # absolute path/member locators, and the fixed C-RADIO mining embedding.
  # GRIT observations are recomputed from the current DINOv3 checkpoint.
  target_manifest: /path/to/unlabeled_target_images.parquet
  previous_training_manifest: /path/to/parent_training_manifest.parquet
  # Binds every file/archive locator to an immutable, versioned dataset root.
  source_payload_contract: /path/to/source_payload_contract.json
  source_store_manifest: /path/to/cradiov4_embedding_store/embedding_store.json
  target_embedding_contract: /path/to/target_embedding_contract.json

grit:
  target_fraction: 0.10

mining:
  top_k_per_target: 32
  min_similarity: 0.80
  hard_min_similarity: 0.74
  similarity_step: 0.02
  duplicate_similarity: 0.995
  candidate_multiplier: 10
  parent_history_policy: exclude

training:
  base_spec: /path/to/dinov3_train_spec.yaml
  passes_per_round: 12
  lr_scaling_rule: preserve_base_spec
  # Accumulate mined data, not model updates. Every candidate starts from this
  # run's immutable model.base_checkpoint.
  checkpoint_policy: base_checkpoint_each_round

actions:
  score:
    command: [dinov3, grit_score, -e, "{score_config}"]
    settings:
      batch_size: 12
      workers: 8
      device: cuda
      amp: true
      # Exact CUDA neighbors using the Torch already packaged in DS.
      neighbor_backend: torch_exact
      neighbor_device: cuda
      # The platform must map this environment variable to node-local scratch.
      work_dir: $TAO_LOCAL_SCRATCH/dinov3-grit
    execution_mode: runner
    resources:
      gpus: 1
      local_scratch: {path_environment: TAO_LOCAL_SCRATCH}
  data:
    command: [python, -m, nvidia_tao_ds.mining.dinov3.entrypoint.refinement]
  search:
    # Empty uses the correctness-first exact scanner. Large stores can supply
    # an audited ANN or distributed adapter with the same output contract.
    command: []
  train:
    command: [dinov3, train, -e, "{training_spec}"]
    execution_mode: runner
    resources: {nodes: 1, gpus_per_node: 1}
  evaluate:
    command: []

execution:
  # Run within one already-allocated TAO DS container; no nested container.
  # Use backend: external for distributed or separate-image platform jobs.
  backend: local
  poll_seconds: 10
  # GPU FAISS is optional; request and verify it only for faiss_exact scoring.
  capabilities: {}

output:
  run_dir: /path/to/runs/dinov3_grit
